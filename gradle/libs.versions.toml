[versions]
# These four are a matched set. Changing one usually means changing another.
#
#   agp    — AGP 9 uses built-in Kotlin and would otherwise pin Kotlin to the
#            KGP it was built against (2.2.10). The root build.gradle.kts
#            overrides that with `kotlin` below.
#   kotlin — also drives the Compose and serialization plugin versions. Must be
#            new enough to read dependency metadata (Coil 3.5 emits 2.4) and no
#            newer than Hilt's bundled kotlin-metadata-jvm can parse.
#   ksp    — independently versioned since 2.3.0. Only the new scheme works with
#            built-in Kotlin; `<kotlin>-<ksp>` builds use the kotlin.sourceSets
#            DSL, which built-in Kotlin forbids.
#   hilt   — 2.60+ required: 2.59 maxes out at Kotlin 2.3 metadata and chokes on
#            androidx.activity 1.13, which ships 2.4.
agp = "9.3.1"
kotlin = "2.4.10"
ksp = "2.3.11"
hilt = "2.60.1"

# SDK.
# compileSdk is 37 because Compose 1.12 / lifecycle 2.11 refuse to be consumed
# by anything older. targetSdk stays at 36: that is what Play mandates from
# 2026-08-31, and it avoids opting into Android 17 behaviour changes we have not
# tested. The two are independent knobs; bump targetSdk deliberately, later.
compileSdk = "37"
compileSdkMinor = "1"
targetSdk = "36"
# minSdk 29 (Android 10) buys uniform MediaStore semantics: RELATIVE_PATH and
# DISPLAY_NAME always present, ContentResolver.loadThumbnail available, scoped
# storage everywhere. Supporting 26-28 would mean deriving the folder path from
# the deprecated DATA column, which yields a *different* stable song identity
# than RELATIVE_PATH does — so a device upgrading 28 -> 29 would lose its
# playlists. Not worth it for the few percent of devices still on Oreo/Pie.
minSdk = "29"

# AndroidX
activityCompose = "1.13.0"
composeBom = "2026.08.00"
coreKtx = "1.18.0"
datastore = "1.2.1"
hiltNavigationCompose = "1.4.0"
lifecycle = "2.11.0"
media3 = "1.11.0"
navigationCompose = "2.9.8"
room = "2.8.4"

# Third party
coil = "3.5.0"
coroutines = "1.11.0"
serialization = "1.11.0"

# Test
junit = "4.13.2"
androidxJunit = "1.3.0"
espresso = "3.7.0"
robolectric = "4.16.1"
turbine = "1.2.1"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }

# Compose (versions come from the BOM)
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }

androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }

androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }

androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-room-testing = { module = "androidx.room:room-testing", version.ref = "room" }

androidx-media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
androidx-media3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }
androidx-media3-common = { module = "androidx.media3:media3-common", version.ref = "media3" }

hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }

kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

junit = { module = "junit:junit", version.ref = "junit" }
androidx-junit = { module = "androidx.test.ext:junit", version.ref = "androidxJunit" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
